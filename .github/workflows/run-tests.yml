name: Run tests

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  run-tests:
    name: Run tests
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        channel: [latest/edge, latest/edge/strict]

    steps:
      - name: Check out code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Install dependencies
        run: |
          python3 -m venv venv
          source venv/bin/activate
          pip install --upgrade pip
          pip install -r tests/requirements.txt
      - name: Running addons tests
        run: |
          set -x
          # --classic is only valid (and needed) for the classic snap. Passing it
          # for the strict channel let snapd silently ignore it and fall back to
          # installing whatever classic revision remains once the "strict" branch
          # expires, so the strict leg ended up testing the classic snap under a
          # different name. Drop it for the strict leg so a missing strict
          # revision is a loud install failure instead of a silent false pass.
          if [[ "${{ matrix.channel }}" == "latest/edge/strict" ]]
          then
            sudo snap install microk8s --channel=${{ matrix.channel }}
            # Belt-and-braces: assert the installed snap is actually strict-confined.
            # If the "strict" branch has expired, snapd can otherwise resolve the
            # channel down to the classic revision without a clear error, which is
            # exactly how the cis-hardening strict bug (#410) went undetected here.
            confinement=$(snap info microk8s | awk '/^confinement:/ {print $2}')
            if [[ "$confinement" != "strict" ]]; then
              echo "::error::Expected a strict-confinement microk8s snap on channel ${{ matrix.channel }}, got confinement '$confinement'. The strict snap branch has likely expired and needs a fresh publish." >&2
              exit 1
            fi
          else
            sudo snap install microk8s --classic --channel=${{ matrix.channel }}
          fi
          sudo microk8s status --wait-ready --timeout 600
          sudo microk8s addons repo remove core
          sudo microk8s addons repo add core .

          # The GitHub runner is using the 10.1.0.0/16 CIDR, which would conflict with
          # kube-ovn's default POD_CIDR. They have to be different.
          export POD_CIDR="10.200.0.0/16"
          export POD_GATEWAY="10.200.0.1"
          export UNDER_TIME_PRESSURE="True"
          if [[ "${{ matrix.channel }}" == "latest/edge/strict" ]]
          then
            export STRICT="yes"
          fi
          export SKIP_PROMETHEUS="False"
          sudo -E venv/bin/pytest -s -ra ./tests/test-addons.py
          sudo snap remove microk8s --purge
